name: Rust shadow

on:
  pull_request:
    paths:
      - rust/**
      - .github/workflows/rust-shadow.yml
  push:
    branches: [main]
    paths:
      - rust/**
      - .github/workflows/rust-shadow.yml

permissions:
  contents: read

concurrency:
  group: rust-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust shadow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set the isolated Cargo target directory
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/diskm-rust-target"
            echo "DISKM_SCRATCH_TEST_DIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Test the candidate executable and fixtures
        run: cargo test --locked --all-targets
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Preserve the tested preview executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: diskm-rust-${{ matrix.os }}
          path: ${{ runner.temp }}/diskm-rust-target/debug/diskm
          if-no-files-found: error
          retention-days: 3
