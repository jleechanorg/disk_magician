name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Build the Rust framework
        run: cargo build --locked
      - name: Lint the Rust framework
        run: cargo clippy --locked -- -D warnings
      - name: Run the built CLI
        run: cargo run --locked -- --help
