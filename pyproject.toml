[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-magician"
version = "0.2.294"
description = "Portable Disk Diagnostics, Snapshot Backups, & Cleanup"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
disk-magician = "disk_magician.cli:main"
diskm = "disk_magician.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disk_magician = ["disk_magician.sh", "config.json.template", "config/*.txt", "scripts/*.sh", "scripts/*.py", "scripts/*.swift", "scripts/lib/*.sh", "launchd/*.plist", "launchd/*.plist.template", "launchd/*.c", "tools/*.sh", "tools/guards/*", "hooks/*.sh"]
